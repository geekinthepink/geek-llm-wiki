<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1060" width="1500" height="1060">
  <style>
    text { font-family: "SF Mono", "Fira Code", "Cascadia Code", "Courier New", monospace; }
    .title { font-size: 28px; font-weight: 700; fill: #e2e8f0; }
    .subtitle { font-size: 14px; fill: #94a3b8; }
    .label { font-size: 14px; font-weight: 700; fill: #e2e8f0; }
    .sublabel { font-size: 11px; fill: #94a3b8; }
    .msg { font-size: 13px; fill: #e2e8f0; }
    .small { font-size: 11px; fill: #94a3b8; }
    .legend { font-size: 12px; fill: #cbd5e1; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c084fc"/>
    </marker>
  </defs>
  <rect width="1500" height="1060" fill="url(#bg-grad)"/>
  <rect x="28" y="28" width="1444" height="1004" rx="18" fill="#0b1120" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="70" cy="66" r="7" fill="#34d399"/>
  <text x="90" y="74" class="title">Hermes Skill 原理时序图</text>
  <text x="90" y="100" class="subtitle">基于昨天分析：skills 索引注入 → skills_list 摘要发现 → skill_view 加载完整 SKILL.md → 按 skill 约束执行工具</text>
  <rect x="70" y="114" width="1360" height="34" rx="10" fill="#111827" stroke="#334155" stroke-width="1.1"/>
  <line x1="110" y1="131" x2="160" y2="131" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="172" y="136" class="legend">用户 / agent 主请求链路</text>
  <line x1="430" y1="131" x2="480" y2="131" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="492" y="136" class="legend">skills 目录 / SKILL.md 读取</text>
  <line x1="785" y1="131" x2="835" y2="131" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="847" y="136" class="legend">模型的 skill 决策与加载</text>
  <line x1="1095" y1="131" x2="1145" y2="131" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="1157" y="136" class="legend">按 skill 约束触发运行时工具</text>
  <rect x="30" y="164" width="140" height="42" rx="10" fill="#082f49" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="100" y="190" class="label" text-anchor="middle">用户</text>
  <line x1="100" y1="206" x2="100" y2="940" stroke="#475569" stroke-width="1.2" stroke-dasharray="7,7"/>
  <rect x="210" y="164" width="140" height="42" rx="10" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="280" y="190" class="label" text-anchor="middle">AIAgent</text>
  <line x1="280" y1="206" x2="280" y2="940" stroke="#475569" stroke-width="1.2" stroke-dasharray="7,7"/>
  <rect x="390" y="164" width="140" height="42" rx="10" fill="#1f2937" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="460" y="190" class="label" text-anchor="middle">prompt_builder</text>
  <line x1="460" y1="206" x2="460" y2="940" stroke="#475569" stroke-width="1.2" stroke-dasharray="7,7"/>
  <rect x="570" y="164" width="140" height="42" rx="10" fill="#1f2937" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="640" y="190" class="label" text-anchor="middle">skill_utils</text>
  <line x1="640" y1="206" x2="640" y2="940" stroke="#475569" stroke-width="1.2" stroke-dasharray="7,7"/>
  <rect x="750" y="164" width="140" height="42" rx="10" fill="#052e16" stroke="#34d399" stroke-width="1.5"/>
  <text x="820" y="190" class="label" text-anchor="middle">Skills目录</text>
  <line x1="820" y1="206" x2="820" y2="940" stroke="#475569" stroke-width="1.2" stroke-dasharray="7,7"/>
  <rect x="930" y="164" width="140" height="42" rx="10" fill="#312e81" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1000" y="190" class="label" text-anchor="middle">LLM</text>
  <line x1="1000" y1="206" x2="1000" y2="940" stroke="#475569" stroke-width="1.2" stroke-dasharray="7,7"/>
  <rect x="1110" y="164" width="140" height="42" rx="10" fill="#1f2937" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1180" y="190" class="label" text-anchor="middle">skills_tool</text>
  <line x1="1180" y1="206" x2="1180" y2="940" stroke="#475569" stroke-width="1.2" stroke-dasharray="7,7"/>
  <rect x="1290" y="164" width="140" height="42" rx="10" fill="#3f1d0d" stroke="#fb923c" stroke-width="1.5"/>
  <text x="1360" y="190" class="label" text-anchor="middle">Runtime Tools</text>
  <line x1="1360" y1="206" x2="1360" y2="940" stroke="#475569" stroke-width="1.2" stroke-dasharray="7,7"/>
  <rect x="1080" y="520" width="210" height="92" rx="10" fill="#111827" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="8,5"/>
  <text x="1095" y="543" class="label">按需加载</text>
  <text x="1095" y="565" class="small">如果模型已确定目标 skill，</text>
  <text x="1095" y="582" class="small">也可能直接跳过 skills_list()</text>
  <path d="M 100,230 L 280,230" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <rect x="78.0" y="206" width="224" height="22" rx="6" fill="#0b1120" fill-opacity="0.94" stroke="#334155" stroke-width="0.8"/>
  <text x="190.0" y="221" class="msg" text-anchor="middle">1. 发送任务：分析 Hermes skill 原理</text>
  <rect x="273" y="216" width="14" height="54" rx="4" fill="#60a5fa" fill-opacity="0.65" stroke="#60a5fa" stroke-width="1"/>
  <path d="M 280,280 L 460,280" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <rect x="286.0" y="256" width="168" height="22" rx="6" fill="#0b1120" fill-opacity="0.94" stroke="#334155" stroke-width="0.8"/>
  <text x="370.0" y="271" class="msg" text-anchor="middle">2. 组装 system prompt</text>
  <rect x="453" y="266" width="14" height="54" rx="4" fill="#94a3b8" fill-opacity="0.65" stroke="#94a3b8" stroke-width="1"/>
  <path d="M 460,330 L 640,330" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <rect x="418.0" y="306" width="264" height="22" rx="6" fill="#0b1120" fill-opacity="0.94" stroke="#334155" stroke-width="0.8"/>
  <text x="550.0" y="321" class="msg" text-anchor="middle">3. build_skills_system_prompt()</text>
  <rect x="633" y="316" width="14" height="54" rx="4" fill="#94a3b8" fill-opacity="0.65" stroke="#94a3b8" stroke-width="1"/>
  <path d="M 640,380 L 820,380" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <rect x="606.0" y="356" width="248" height="22" rx="6" fill="#0b1120" fill-opacity="0.94" stroke="#334155" stroke-width="0.8"/>
  <text x="730.0" y="371" class="msg" text-anchor="middle">4. 扫描 skills 目录 / frontmatter</text>
  <rect x="813" y="366" width="14" height="54" rx="4" fill="#34d399" fill-opacity="0.65" stroke="#34d399" stroke-width="1"/>
  <path d="M 820,440 L 640,440" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <rect x="586.0" y="416" width="288" height="22" rx="6" fill="#0b1120" fill-opacity="0.94" stroke="#334155" stroke-width="0.8"/>
  <text x="730.0" y="431" class="msg" text-anchor="middle">5. 返回 skill 索引（name/desc/category）</text>
  <path d="M 280,500 L 1000,500" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <rect x="528.0" y="476" width="224" height="22" rx="6" fill="#0b1120" fill-opacity="0.94" stroke="#334155" stroke-width="0.8"/>
  <text x="640.0" y="491" class="msg" text-anchor="middle">6. 提交 messages + tools 给模型</text>
  <rect x="993" y="486" width="14" height="54" rx="4" fill="#a78bfa" fill-opacity="0.65" stroke="#a78bfa" stroke-width="1"/>
  <path d="M 1000,560 L 1180,560" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <rect x="982.0" y="536" width="216" height="22" rx="6" fill="#0b1120" fill-opacity="0.94" stroke="#334155" stroke-width="0.8"/>
  <text x="1090.0" y="551" class="msg" text-anchor="middle">7. skills_list()：先看候选技能摘要</text>
  <rect x="1173" y="546" width="14" height="54" rx="4" fill="#94a3b8" fill-opacity="0.65" stroke="#94a3b8" stroke-width="1"/>
  <path d="M 1180,620 L 820,620" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <rect x="908.0" y="596" width="184" height="22" rx="6" fill="#0b1120" fill-opacity="0.94" stroke="#334155" stroke-width="0.8"/>
  <text x="1000.0" y="611" class="msg" text-anchor="middle">8. 枚举 skills 并读取摘要元数据</text>
  <rect x="813" y="606" width="14" height="54" rx="4" fill="#34d399" fill-opacity="0.65" stroke="#34d399" stroke-width="1"/>
  <path d="M 1180,680 L 1000,680" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <rect x="1018.0" y="656" width="144" height="22" rx="6" fill="#0b1120" fill-opacity="0.94" stroke="#334155" stroke-width="0.8"/>
  <text x="1090.0" y="671" class="msg" text-anchor="middle">9. 返回候选 skill 列表</text>
  <path d="M 1000,740 L 1180,740" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <rect x="958.0" y="716" width="264" height="22" rx="6" fill="#0b1120" fill-opacity="0.94" stroke="#334155" stroke-width="0.8"/>
  <text x="1090.0" y="731" class="msg" text-anchor="middle">10. skill_view(name)：加载完整 skill</text>
  <rect x="1173" y="726" width="14" height="54" rx="4" fill="#94a3b8" fill-opacity="0.65" stroke="#94a3b8" stroke-width="1"/>
  <path d="M 1180,800 L 820,800" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <rect x="872.0" y="776" width="256" height="22" rx="6" fill="#0b1120" fill-opacity="0.94" stroke="#334155" stroke-width="0.8"/>
  <text x="1000.0" y="791" class="msg" text-anchor="middle">11. 读取 SKILL.md / linked files</text>
  <rect x="813" y="786" width="14" height="54" rx="4" fill="#34d399" fill-opacity="0.65" stroke="#34d399" stroke-width="1"/>
  <path d="M 1180,860 L 1000,860" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <rect x="982.0" y="836" width="216" height="22" rx="6" fill="#0b1120" fill-opacity="0.94" stroke="#334155" stroke-width="0.8"/>
  <text x="1090.0" y="851" class="msg" text-anchor="middle">12. 返回完整内容、tags、readiness</text>
  <path d="M 1000,925 L 1360,925" stroke="#fb923c" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/>
  <rect x="1092.0" y="901" width="176" height="22" rx="6" fill="#0b1120" fill-opacity="0.94" stroke="#334155" stroke-width="0.8"/>
  <text x="1180.0" y="916" class="msg" text-anchor="middle">13. 按 skill 约束调用实际工具</text>
  <rect x="1353" y="911" width="14" height="40" rx="4" fill="#fb923c" fill-opacity="0.65" stroke="#fb923c" stroke-width="1"/>
  <path d="M 1360,965 L 1000,965" stroke="#fb923c" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/>
  <rect x="1127.0" y="941" width="106" height="22" rx="6" fill="#0b1120" fill-opacity="0.94" stroke="#334155" stroke-width="0.8"/>
  <text x="1180.0" y="956" class="msg" text-anchor="middle">14. 工具结果返回</text>
  <path d="M 1000,1000 Q 640.0,1018 280,1000" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <rect x="587.0" y="987.0" width="106" height="22" rx="6" fill="#0b1120" fill-opacity="0.94" stroke="#334155" stroke-width="0.8"/>
  <text x="640.0" y="1002.0" class="msg" text-anchor="middle">15. 生成最终回答</text>
  <path d="M 280,965 L 100,965" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <rect x="137.0" y="941" width="106" height="22" rx="6" fill="#0b1120" fill-opacity="0.94" stroke="#334155" stroke-width="0.8"/>
  <text x="190.0" y="956" class="msg" text-anchor="middle">16. 返回给用户</text>
  <rect x="60" y="980" width="1380" height="34" rx="10" fill="#111827" stroke="#334155" stroke-width="1.1"/>
  <text x="80" y="1002" class="legend">关键语义：skill 不是代码插件，而是带 frontmatter / linked files / readiness 状态的结构化操作手册；模型先看到 skills 索引，再按需用 skills_list 与 skill_view 做渐进式加载。</text>
</svg>